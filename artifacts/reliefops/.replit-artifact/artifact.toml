kind = "web"
previewPath = "/"
title = "ReliefOps"
version = "1.0.0"
id = "artifacts/reliefops"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21132

[services.development]
run = "pnpm --filter @workspace/reliefops run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/reliefops", "run", "build" ]
publicDir = "artifacts/reliefops/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21132"
BASE_PATH = "/"
