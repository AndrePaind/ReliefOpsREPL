            fullName:
              type: string
              nullable: true
            email:
              type: string
            role:
              type: string
        type:
          type: string
          enum: [Pickup, "Delivery/Transfer", "Stock Count"]
        status:
          type: string
          enum: [Open, Assigned, "In Progress", Done]
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
